{% extends 'blog/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<h2>Register</h2>
{% if messages %}
    {% for message in messages %}
        <p class="{{ message.tags }}">{{ message }}</p>
    {% endfor %}
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>
<p><a href="{% url 'login' %}">Already have an account? Login here.</a></p>
{% endblock %}
