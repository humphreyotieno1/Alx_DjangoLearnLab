{% extends 'blog/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
{% if messages %}
    {% for message in messages %}
        <p class="{{ message.tags }}">{{ message }}</p>
    {% endfor %}
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>
<p><a href="{% url 'register' %}">Don't have an account? Register here.</a></p>
{% endblock %}
